name: Build and publish v1.1.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'src/**'
      - 'tools/GenerateAppIcon.ps1'
  workflow_dispatch:
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate branded Windows icon
        shell: pwsh
        run: |
          ./tools/GenerateAppIcon.ps1
          if (!(Test-Path 'src/NipkgCreator/Assets/NipkgCreator.ico')) { throw "App icon missing" }
      - name: Publish Windows x64 single-file EXE
        shell: pwsh
        run: |
          dotnet publish src/NipkgCreator/NipkgCreator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          if (!(Test-Path 'publish/NipkgCreator.exe')) { throw "EXE missing" }
          $exe = Get-Item 'publish/NipkgCreator.exe'
          if ($exe.Length -lt 1000000) { throw "Unexpectedly small EXE" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          if ($null -eq $icon) { throw "Embedded icon missing" }
          $icon.Dispose()
          Get-FileHash 'publish/NipkgCreator.exe' -Algorithm SHA256 | Format-List
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: NipkgCreator-v1.1.2-win-x64
          path: publish/NipkgCreator.exe
          if-no-files-found: error
      - name: Publish stable v1.1.2 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.1.2'
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to overwrite it"
          }
          gh release create $tag 'publish/NipkgCreator.exe' --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Nipkg Creator v1.1.2" --notes "Fix Copy button truncation, enlarge Browse and Auto button columns, improve high-DPI layout. Self-contained Windows x64." --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
