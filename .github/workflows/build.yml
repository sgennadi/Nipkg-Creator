name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish standalone single-file EXE
        run: dotnet publish src/NipkgCreator/NipkgCreator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: NipkgCreator-win-x64
          path: publish/NipkgCreator.exe
          if-no-files-found: error
